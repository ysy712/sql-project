<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智慧林草环境监测系统</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-color: #2E7D32;
            --secondary-color: #4CAF50;
            --dark-green: #1B5E20;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f8f9fa, #e8f5e9);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--dark-green), var(--primary-color));
            color: white;
            padding: 20px;
            text-align: center;
        }

        .login-body {
            padding: 30px;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            padding: 12px 15px;
        }

        .form-control:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 0.2rem rgba(76, 175, 80, 0.25);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            transition: transform 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .text-link {
            color: var(--primary-color);
            text-decoration: none;
        }

        .text-link:hover {
            color: var(--dark-green);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card card">
        <div class="login-header">
            <i class="fas fa-tree fa-2x mb-2"></i>
            <h4 class="mb-0">智慧林草环境监测系统</h4>
            <p class="mb-0 text-light-opacity">请登录您的账号</p>
        </div>
        <div class="login-body card-body">
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
                    </div>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">记住我</label>
                </div>
                <button type="submit" class="btn-login">登录</button>
                <div class="text-center mt-3">
                    <a href="#" class="text-link">忘记密码?</a>
                </div>
            </form>

        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            console.log('登录尝试:', { username, password });
            
            if (username && password) {
                // 显示加载状态
                const btn = this.querySelector('.btn-login');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>登录中...';
                btn.disabled = true;
                
                // 调用登录API
                fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                })
                .then(response => {
                    console.log('响应状态:', response.status);
                    return response.json();
                })
                .then(data => {
                    console.log('API响应:', data);
                    if (data.code === 200) {
                        // 存储token
                        if (data.data && data.data.token) {
                            localStorage.setItem('token', data.data.token);
                            console.log('Token存储成功');
                        }
                        // 登录成功，跳转到首页
                        console.log('登录成功，跳转到首页');
                        window.location.href = '/home';
                    } else {
                        alert('登录失败: ' + (data.message || '用户名或密码错误'));
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }
                })
                .catch(error => {
                    console.error('登录错误:', error);
                    // 如果API不可用，模拟登录（测试用）
                    alert('API服务暂时不可用，使用模拟登录进行测试');
                    // 存储模拟token
                    localStorage.setItem('token', 'simulated-token-for-testing');
                    // 模拟登录成功，跳转到首页
                    window.location.href = '/home';
                });
            } else {
                alert('请输入用户名和密码');
            }
        });
        
        // 自动填充测试账号
        document.addEventListener('DOMContentLoaded', function() {
            // 如果是开发环境，自动填充测试账号
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                document.getElementById('username').value = 'test_admin';
                document.getElementById('password').value = '123456';
                document.getElementById('rememberMe').checked = true;
            }
        });

    </script>
</body>
</html>
